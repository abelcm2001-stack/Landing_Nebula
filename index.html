<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nébula | Arte Digital</title>
<meta name="description" content="Explora el universo creativo de Nébula, un espacio de arte digital y creatividad futurista.">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    
    <svg class="logo-svg"
     xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1418 1418"
     width="150"
     height="150"
     role="img"
     aria-labelledby="logo-title"
     tabindex="0">

    <title id="logo-title">Logotipo de Nébula</title>

    <path class="logo-star"
          d="M708.661,438.913l47.902,147.428l155.015,0l-125.41,91.116l47.902,147.428l-125.41,-91.116l-125.41,91.116l47.902,-147.428l-125.41,-91.116l155.015,-0l47.902,-147.428Z"/>

    <g transform="matrix(0.999987,-0.00514,0.00514,0.999987,0.45522,0.285376)">
        <text class="logo-text"
              x="500.751"
              y="955.484">NEBULA</text>
    </g>

</svg>

    <nav>
        <a href="#galeria">Galería</a>
        <a href="#video">Vídeo</a>
        <a href="#audio">Audio</a>
        <a href="#contacto">Contacto</a>
    </nav>
</header>

<main>

<section id="galeria">
<h2>Bienvenido al universo de Nébula</h2>


<div class="visor-galeria">
    <figure>
        <img id="imagen-principal"
             src="assets/img/Imagen-Galeria.webp"
             alt="Primera obra futurista de Nébula"
             width="800"
             height="500">

        <figcaption id="descripcion-imagen">
            Autor: zhao-yangyang
        </figcaption>
    </figure>
</div>


<div class="galeria">

    <figure>
        <img src="assets/img/Imagen-Galeria.webp"
             alt="Primera obra futurista de Nébula"
             data-imagen="assets/img/Imagen-Galeria.webp"
             data-autor="Autor: zhao-yangyang"
             tabindex="0"
             role="button"
             aria-label="Mostrar primera obra">
        <figcaption>Autor: zhao-yangyang</figcaption>
    </figure>

    <figure>
        <img src="assets/img/Imagen-Galeria1.webp"
             alt="Segunda obra futurista de Nébula"
             data-imagen="assets/img/Imagen-Galeria1.webp"
             data-autor="Autor: jisang-jung"
             tabindex="0"
             role="button"
             aria-label="Mostrar segunda obra">
        <figcaption>Autor: jisang-jung</figcaption>
    </figure>

    <figure>
        <img src="assets/img/Imagen-Galeria2.webp"
             alt="Tercera obra futurista de Nébula"
             data-imagen="assets/img/Imagen-Galeria2.webp"
             data-autor="Autor: jivan-garcha"
             tabindex="0"
             role="button"
             aria-label="Mostrar tercera obra">
        <figcaption>Autor: jivan-garcha</figcaption>
    </figure>

</div>
</section>



    <section id="video">
        <h2>Nébula, el planeta en vídeo</h2>

        <video controls width="854" height="480"
               poster="assets/img/Imagen-fija.webp">
            <source src="assets/video/Videofuturista.mp4" type="video/mp4">
            Tu navegador no puede reproducir este vídeo.
        </video>
    </section>

    <section id="audio">
        <h2>Ambiente futurista</h2>
        <p>Escucha el sonido futurista de Nébula.</p>

        <audio controls>
            <source src="assets/audio/Audio futurista.mp3" type="audio/mpeg">
            Tu navegador no puede reproducir este audio.
        </audio>
    </section>

    <section id="contacto" class="contacto">
        <h2>¿Te unes a Nébula?</h2>
        

        <img src="assets/img/Contacto.gif"
             alt="Animación de contacto futurista de Nébula"
             width="400" height="150" loading="lazy">
             <p>¡Contacta conmigo!</p>
    </section>

</main>

<footer>
    <p> 2026 Nébula / Arte Digital</p>
</footer>
</body>
</html>
